# Field hub, MediaMTX v1.21.x. Cameras publish on 192.168.77.10.
# OBS reads on 127.0.0.1. Also apply the scoped Windows firewall rule in the guide.
logLevel: info
rtmp: true
rtmpAddress: "0.0.0.0:1935"
rtsp: false
hls: false
webrtc: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

authMethod: internal
authInternalUsers:
  - user: any
    ips: ["192.168.77.0/24"]
    permissions:
      - action: publish
  - user: any
    ips: ["127.0.0.1"]
    permissions:
      - action: read

pathDefaults:
  source: publisher
  overridePublisher: false
paths:
  live/dji: {}
  live/gopro1: {}
  live/gopro2: {}
  live/gopro3: {}

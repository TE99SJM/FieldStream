name: Dual-quality browser preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'DualQualityHub/**'
      - '.github/workflows/dual-quality-preview.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install receiver and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m venv /tmp/fieldstream-env
          /tmp/fieldstream-env/bin/pip install -r DualQualityHub/requirements.txt playwright
          /tmp/fieldstream-env/bin/python setup_receiver.py
      - name: Decode all five WebRTC previews in Chrome
        working-directory: DualQualityHub
        run: |
          /tmp/fieldstream-env/bin/python launch.py --demo --no-obs --ip 127.0.0.1 > /tmp/fieldstream.log 2>&1 &
          hub_pid=$!
          trap 'kill -TERM "$hub_pid" 2>/dev/null || true' EXIT
          /tmp/fieldstream-env/bin/python verify_previews.py
      - name: Show receiver diagnostics on failure
        if: failure()
        run: |
          tail -100 DualQualityHub/.runtime/media.log || true
          tail -30 DualQualityHub/.runtime/web.log || true
